# Production overrides — no dev mounts, restart policy, resource hints.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  worker:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  web:
    restart: unless-stopped

  postgres:
    restart: unless-stopped
    # Docker publishes ports straight to the host firewall's DOCKER chain, bypassing
    # UFW's INPUT rules. Drop the base file's 5432 host bind so Postgres is only
    # reachable on the internal compose network (mirrors docker-compose.staging.yml).
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  redis:
    restart: unless-stopped
    command: redis-server --appendonly yes
    # Same firewall-bypass reasoning as postgres above: no host bind in production.
    ports: !reset []
    # AOF (--appendonly yes) is worthless without a durable volume: the arq queue and
    # rate-limit counters would live on the ephemeral container layer and vanish on
    # recreate. Persist /data (mirrors how docker-compose.yml persists pgdata).
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  # TLS edge for a DEDICATED host — Caddy takes :80/:443 and does its own ACME.
  # Caddy was otherwise only defined in docker-compose.staging.yml, so the
  # production overlay had nothing listening on 80/443 at all.
  #
  # Behind the `edge` profile because it is not always wanted: on a host that
  # already runs nginx for other sites, those ports are taken and the right
  # answer is to point that nginx at web:3000/api:8000 rather than fight it.
  # `deploy_prod_vps.sh` selects between the two with LEOVEE_EDGE.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - edge
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LEOVEE_DOMAIN: ${LEOVEE_DOMAIN:?LEOVEE_DOMAIN is required for TLS}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required for certificate issuance}
    volumes:
      - ./docker/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # DATABASE_MIGRATION_URL deliberately comes from .env and is NOT pinned in an
    # `environment:` block: compose gives `environment:` precedence over
    # `env_file:`, so pinning it here silently discarded the operator's password
    # and the migrate step would authenticate with the built-in `leovee:leovee`.
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  redisdata: {}
  caddy_data: {}
  caddy_config: {}
