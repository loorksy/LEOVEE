# Production overrides — no dev mounts, restart policy, resource hints.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  worker:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  web:
    restart: unless-stopped

  postgres:
    restart: unless-stopped
    # Docker publishes ports straight to the host firewall's DOCKER chain, bypassing
    # UFW's INPUT rules. Drop the base file's 5432 host bind so Postgres is only
    # reachable on the internal compose network (mirrors docker-compose.staging.yml).
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  redis:
    restart: unless-stopped
    command: redis-server --appendonly yes
    # Same firewall-bypass reasoning as postgres above: no host bind in production.
    ports: !reset []
    # AOF (--appendonly yes) is worthless without a durable volume: the arq queue and
    # rate-limit counters would live on the ephemeral container layer and vanish on
    # recreate. Persist /data (mirrors how docker-compose.yml persists pgdata).
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_MIGRATION_URL: postgresql+asyncpg://leovee:leovee@postgres:5432/leovee
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  redisdata: {}
