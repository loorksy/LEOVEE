services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: leovee
      # Interpolated so production can set a real password in .env. The default
      # keeps `docker compose up` working for local dev with no .env at all —
      # it is only ever reached when POSTGRES_PASSWORD is unset.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leovee}
      POSTGRES_DB: leovee
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leovee -d leovee"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Drain in-flight requests before SIGKILL on stop/recreate.
    stop_grace_period: 30s
    # Readiness gate for dependents (web, leovee-mcp). /health/ready checks deps
    # (db/redis), unlike the image's /health/live probe. curl is not installed in
    # the API image (python:3.12-slim + libpq only), so probe via python/urllib —
    # matching the pattern already used in docker/api.Dockerfile.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Let arq finish the current job (and shut its pool) before SIGKILL.
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy

  leovee-mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pgdata:
