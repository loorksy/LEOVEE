name: Deploy staging (VPS)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy
        required: true
        default: main

concurrency:
  group: leovee-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require VPS secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "${VPS_HOST}" || (echo "Missing repository secret VPS_HOST" && exit 1)
          test -n "${VPS_SSH_PRIVATE_KEY}" || (echo "Missing repository secret VPS_SSH_PRIVATE_KEY" && exit 1)

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          BRANCH: ${{ inputs.branch }}
        run: |
          export VPS_SSH_KEY_PATH=~/.ssh/id_ed25519
          export VPS_USER="${VPS_USER:-root}"
          ./scripts/remote_deploy_vps.sh

      - name: Smoke check
        env:
          API_URL: http://${{ secrets.VPS_HOST }}:8000
        run: ./scripts/smoke_staging.sh
