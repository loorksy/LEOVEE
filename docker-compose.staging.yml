# Staging / VPS overrides (DEPLOYMENT.md §16.1)
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.agent.yml up -d

services:
  # No host bind for Postgres/Redis (shared VPS / local conflicts).
  postgres:
    ports: !reset []
  redis:
    ports: !reset []

  api:
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: staging
    restart: unless-stopped

  worker:
    environment:
      ENVIRONMENT: staging
    restart: unless-stopped

  leovee-mcp:
    ports: !override
      - "127.0.0.1:8001:8001"
    environment:
      ENVIRONMENT: staging
    restart: unless-stopped

  web:
    ports: !reset []
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"
    environment:
      LEOVEE_DOMAIN: ${LEOVEE_DOMAIN:-staging.leovee.lork.cloud}
      ACME_EMAIL: ${ACME_EMAIL:-admin@lork.cloud}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_MIGRATION_URL: postgresql+asyncpg://leovee:leovee@postgres:5432/leovee
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  caddy_data:
  caddy_config:
