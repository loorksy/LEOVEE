# Staging / VPS overrides (DEPLOYMENT.md §16.1)
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d

services:
  # Avoid clashing with host Postgres/other stacks (compose merges port lists from base).
  postgres:
    ports: !reset []
  redis:
    ports: !reset []

  api:
    environment:
      ENVIRONMENT: staging
    restart: unless-stopped

  worker:
    environment:
      ENVIRONMENT: staging
    restart: unless-stopped

  web:
    ports: !override
      - "3001:80"
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_MIGRATION_URL: postgresql+asyncpg://leovee:leovee@postgres:5432/leovee
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
