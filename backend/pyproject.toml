[project]
name = "leovee-backend"
version = "0.1.0"
description = "Leovee — AI Forex trading analyst SaaS API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.9.0",
    "email-validator>=2.2.0",
    "pgvector>=0.3.6",
    "openai>=1.58.0",
    "anthropic>=0.42.0",
    "arq>=0.26.1",
    "stripe>=11.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "types-redis",
    "testcontainers[postgres]>=4.9.0",
    "psycopg2-binary>=2.9.10",
]

[project.scripts]
leovee-mcp = "app.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/**/*.py" = ["E501"]
"app/api/routes/chart.py" = ["E501"]
"app/api/routes/watchlists.py" = ["E501"]
"app/providers/market/oanda_stream.py" = ["E501", "SIM117"]
"app/tests/doubles/market.py" = ["E501"]
"app/tests/test_rls_isolation.py" = ["E501"]
"app/services/market/stream_consumer.py" = ["E501"]
"app/tests/conftest.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
